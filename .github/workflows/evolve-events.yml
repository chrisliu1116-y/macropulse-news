name: 事件卡片每日态势演进（GHA + 免费LLM）

# 每天 2 次（北京 08:00 / 20:00）由 CF Worker Cron dispatch（GHA schedule 在本账号不触发）。
# v452：LLM 走 llm_pool.chat_heavy —— 深度思考(thinkingLevel:high) + 重型主力探测降级链
# (gemini-3-flash-preview → 3.8/3.6-flash → 2.5-pro/flash → 智谱兜底)，timeout=100s。
# 与盘中快讯极速链(智谱flash+gemini-3.1-flash-lite minimal)严格隔离，不占重型额度。
# 做 Scope 过滤 + 三段式重写 + 自动归档，输出 events_daily.json。
# 抓取层沿用项目成熟的多源方案；本 workflow 只做"提纯重写"。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full=全量重写 / dry=仅测试不提交'
        required: false
        default: 'full'

permissions:
  contents: write

concurrency:
  group: evolve-events
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    # v466【方案B·内紧外松】timeout 25→60分钟：历史真实慢班36.8分钟(成功)、
    # 最坏5卡×LLM超时理论~42分钟，25分钟会误杀正常大新闻日；60分钟给足余量且远小于
    # 三班最小间隔7.9h。防卡死主要靠内层 chat_heavy retry_total=180s(坏卡快失败)，
    # 外层60分钟只是最终兜底(仍在GHA强杀释放concurrency锁)。
    # 保持 cancel-in-progress=false：日常无手动触发，手动前须先确认定时任务是否跑完(铁律)。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 方案A·快讯补抓(隔夜/周末断档兜底)
        # 前端 App 切后台冻结→隔夜到07:35无新闻投喂；这里从3个核心源直抓最近24h，
        # 与 CF __news 池合并去重(GHA海外IP直连，不写KV/不调LLM)。失败保留旧产物。
        run: |
          node tools/news_supplement.js
          python3 tools/merge_news.py
          echo "合并池: $(python3 -c 'import json;d=json.load(open("data/news_merged.json"));print(d["cf"],"+",d["supplement"],"->",d["merged"])')"

      - name: 立即持久化补抓池(72h滚动沉淀)
        # v465【解耦】滚动池必须独立于LLM/卡片护栏提交：即使后面LLM报错/超时/护栏assert失败，
        # 刚抓到的新闻池也已安全落库，下次checkout才有历史可滚动累积。
        if: always() && inputs.mode != 'dry'
        run: |
          set -euo pipefail
          git config user.name "evolve-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data/news_supplement.json)" ]; then
            echo "补抓池无变化，跳过立即提交"
            exit 0
          fi
          git add data/news_supplement.json
          git -c user.name="evolve-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            rebase -X ours origin main || true
          git -c user.name="evolve-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "data: 快讯滚动池补抓 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)" || {
              echo "无改动或commit失败，跳过"
              exit 0
            }
          git push origin HEAD:main || {
            echo "::warning::补抓池push失败,重试一次"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main
          }
          echo "已立即持久化 data/news_supplement.json"

      - name: 拉取今日关联新闻（合并池：CF + 补抓）
        env:
          GH_TOKEN: ${{ github.token }}
          MP_NEWS_POOL: data/news_merged.json
        run: |
          # v461：用合并池(CF边缘池 + 方案A补抓)生成事件新闻映射，补上隔夜断档。
          # 合并池不可达时脚本自动回退 CF URL，不会写空污染卡片。
          python3 tools/build_news_map.py data/events_news_today.json data/events_daily.json
          echo "今日新闻映射: $(python3 -c 'import json;d=json.load(open("data/events_news_today.json"));print(sum(len(v) for v in d.values()))') 条"

      - name: LLM 提纯重写卡片
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_KEY }}
        run: |
          python3 tools/evolve_events.py \
            --news data/events_news_today.json \
            --prev data/events_daily.json \
            --out data/events_daily.json

      - name: 自动建卡 + 双轨归档（自治）
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_KEY }}
        run: |
          # v501修复：build_news_map.py 已从 CF 池顺手导出当日 S/A 分级条目，
          # 替换掉之前读不到的旧贴标产物(daily_news_graded/llm_news_full)链路断裂问题。
          if [ -s data/daily_news_graded.json ]; then
            NEWS=data/daily_news_graded.json
            echo "::notice::建卡输入: $(python3 -c 'import json;d=json.load(open("data/daily_news_graded.json"));print(len(d.get("results",[])))' ) 条当日高优快讯"
          else
            NEWS=data/_empty_news.json
            echo '{"results":[]}' > "$NEWS"
            echo "::notice::CF池无当日高优快讯，本次只做归档"
          fi
          python3 tools/event_incubator.py \
            --news "$NEWS" \
            --events data/events_daily.json \
            --out data/events_daily.json \
            --min-high 3

      - name: Polyradar候选筛选（Gamma直连→白名单→CF交叉验证→智谱复核）
        # radar 并入本 workflow：cron-job.org 三班(07:35/15:30/20:50)自动触发本workflow，
        # radar 随之每天自动跑。不再依赖 insum-cloud 那个死了的 GHA schedule。
        # 红线：本步骤只用智谱(zhihu)筛候选，绝不调 Gemini。
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          MP_NEWS_POOL: data/news_merged.json
        run: |
          python3 tools/polymarket_radar.py --out data/_radar_shadow.json

      - name: Polyradar审批队列（骨架入队+确认后Gemini补全）
        # Phase3：radar 净新增候选写 auto_ 骨架卡(不调Gemini)进前端待审队列；
        # 只在 CF /__card-confirm 回执里已确认的候选才调 Gemini 补全三段式。
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_KEY }}
        run: |
          python3 tools/radar_publish.py \
            --radar data/_radar_shadow.json \
            --events data/events_daily.json

      - name: 提交结果（带护栏）
        if: inputs.mode != 'dry'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('data/events_daily.json',encoding='utf-8'))
          cards=d.get('cards',{})
          assert len(cards)>=4, '卡片数不足4'
          for cid,c in cards.items():
              s=c.get('summary','')
              # v471：重型模型偶发20字摘要(归档卡更短)，下限25→15；
              # 归档/休眠卡只要求有简介(≥8字)，上限160、首句48铁律不变。
              minlen = 8 if (c.get('archived') or c.get('dormant')) else 15
              assert minlen<=len(s)<=160, '%s 字数异常 %d'%(cid,len(s))
              first=s.split('。')[0]
              assert len(first)<=48, '%s 首句超45字铁律 %d'%(cid,len(first))
              assert c.get('status'), '%s 无气泡'%cid
          assert len(cards)<=6, '活跃卡超上限6张'
          print('护栏通过: %d张卡(含归档/休眠状态)'%len(cards))
          PY
          git config user.name "evolve-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # v465：滚动池已由上面「立即持久化补抓池」步骤(if:always)独立提交，
          # 这里只管事件卡，避免护栏assert失败时拖累滚动池落库。
          if [ -z "$(git status --porcelain -- data/events_daily.json)" ]; then
            echo "事件卡无变化，跳过提交"
          else
            git add data/events_daily.json
            # v501修复: 先rebase再commit(原顺序commit后pull因unstaged改动冲突);
            # 只暂存目标文件避免把build_news_map导出的json一起带进来。
            git -c user.name="evolve-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              rebase origin main || {
                echo "::warning::rebase冲突，改用ours策略重试"
                git -c user.name="evolve-bot" rebase --abort 2>/dev/null || true
                git -c user.name="evolve-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  rebase -X ours origin main || true
              }
            git -c user.name="evolve-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data: 事件卡片态势演进 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git push origin HEAD:main || {
              echo "::warning::push失败，拉取后重试一次"
              git -c user.name="evolve-bot" pull --rebase origin main || true
              git push origin HEAD:main
            }
            echo "已提交 events_daily.json"
          fi

      - name: 刷新 CDN
        if: inputs.mode != 'dry'
        run: |
          curl -fsS --max-time 20 \
            "https://purge.jsdelivr.net/gh/chrisliu1116-y/macropulse-news@main/data/events_daily.json" \
            || echo "::warning::purge 失败"
