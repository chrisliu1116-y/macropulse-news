name: 新浪快讯 LLM 灰度分级（边缘产物）
# 每15分钟：抓新浪 → 10条微批 LLM 分级 → 写 CF KV → 重新部署 Pages(内嵌 news.json)。
# 无新增短路(refresh 脚本内)省 LLM 额度。前端只读 Pages 静态产物，绝不等待 LLM。
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 抓新浪 + LLM 微批分级 + 写 KV + 出静态产物
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NS: ${{ secrets.CF_KV_NS }}
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SINA_OUT: ${{ github.workspace }}/news_sina.json
        run: python3 tools/refresh_sina_news.py
      - name: 部署 Pages 网关（内嵌最新 news.json + 规则快照）
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SINA_NEWS_JSON: ${{ github.workspace }}/news_sina.json
          FRONT_RULES: ${{ github.workspace }}/prompt_rules.md
        run: |
          # 部署脚本在前端项目里，这里用仓库内的副本路径适配
          python3 tools/deploy_pages_from_gha.py
